name: Deploy to Oracle VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'paulclaim/telegram-forwarder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify deployment and application
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python retry_utils.py

      - name: Check this is still the latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping this older deployment.'
          fi

      - name: Prepare SSH and release
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/oracle_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle_deploy ~/.ssh/known_hosts
          git archive --format=tar --output="$RUNNER_TEMP/release.tar" "$GITHUB_SHA"

      - name: Deploy release and verify health
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.ORACLE_HOST }}
          DEPLOY_USER: ${{ secrets.ORACLE_USER }}
          DEPLOY_PORT: ${{ secrets.ORACLE_PORT }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          endpoint="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_opts=(-i ~/.ssh/oracle_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          stage="/tmp/tg-forwarder-actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_opts[@]}" -p "$port" "$endpoint" "umask 077; mkdir '$stage'"
          trap 'ssh "${ssh_opts[@]}" -p "$port" "$endpoint" "rm -rf -- $stage" || true' EXIT
          scp "${ssh_opts[@]}" -P "$port" "$RUNNER_TEMP/release.tar" scripts/oracle_deploy.py deploy/oracle-deploy.json "$endpoint:$stage/"
          ssh "${ssh_opts[@]}" -p "$port" "$endpoint" "python3 '$stage/oracle_deploy.py' --config '$stage/oracle-deploy.json' --archive '$stage/release.tar' --commit '$GITHUB_SHA'"
          printf '### Oracle deployment\n\nDeployed commit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/oracle_deploy
